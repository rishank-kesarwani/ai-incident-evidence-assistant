services:
  - type: web
    name: ai-incident-evidence-assistant-backend
    env: node
    plan: standard
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health
    autoDeploy: false
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: API_PREFIX
        value: api/v1
      - key: PUBLIC_ACCESS_ENABLE
        value: "false"
      - key: CORS_ORIGIN
        value: "*"
      - key: JWT_SECRET
        generateValue: true
      - key: SERVICE_API_KEY
        generateValue: true
      - key: OPERATOR_ADMIN_PASSWORD
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: AI_PLATFORM_URL
        value: https://ai-platform.onrender.com
      - key: AI_PLATFORM_API_KEY
        sync: false
      - key: NOTIFICATION_SERVICE_URL
        value: https://notification-service.onrender.com
      - key: NOTIFICATION_SERVICE_API_KEY
        sync: false
